<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>伊卡洛斯虚空终端</title>
<link rel="stylesheet" href="icons/sprite.css">
<link rel="stylesheet" href="terminal.css">
<style>
/* ⸻ 样式已迁移至 terminal.css ⸻ */
</style>
</head>
<body>

<!-- 全局顶栏 -->
<div id="topbar">
  <span class="logo">◈ 虚空终端<span class="logo-hash" id="logo-hash"></span></span>
  <span class="spacer"></span>
  <span class="conn-dot" id="conn-dot" title="检测中"></span>
  <span class="gauge-bar" id="gauge-bar" style="display:none"><span class="gauge-fill" id="gauge-fill"></span></span>
  <span id="user-badge" onclick="UI.handleUserBadgeClick()">未登录</span>
</div>

<!-- 桌面侧边栏 -->
<nav id="sidebar">
  <div class="sitem active" data-tab="warehouse"><span class="sitem-icon">📦</span>仓库</div>
  <div class="sitem" data-tab="trade"><span class="sitem-icon">💰</span>交易</div>
  <div class="sitem" data-tab="shipyard"><span class="sitem-icon">🏭</span>船厂</div>
  <div class="sitem" data-tab="hangar"><span class="sitem-icon">🚁</span>船坞</div>
  <div class="sitem" data-tab="settings"><span class="sitem-icon">⚙</span>设置</div>
</nav>

<!-- 主内容区 -->
<div id="main">
  <!-- 登录引导 -->
  <div id="login-guide">
    <div class="hero-icon">🌿</div>
    <h2>伊卡洛斯虚空终端</h2>
    <p class="subtitle">连接至伊卡洛斯星服务器<br>可视化操作你的星际资产</p>
    <div class="login-card">
      <div class="field">
        <label for="lg-steamid">SteamID</label>
        <input id="lg-steamid" type="text" placeholder="在游戏内输入 !info myinfo 获取" autocomplete="off">
      </div>
      <div class="field">
        <label for="lg-pwd">游戏密码</label>
        <input id="lg-pwd" type="password" placeholder="你的游戏密码" autocomplete="off">
      </div>
      <div class="field">
        <label class="chk-row"><input id="lg-remember" type="checkbox" checked><span>记住密码（加密保存在本机）</span></label>
      </div>
      <div class="err" id="lg-err"></div>
      <button class="btn-primary" id="lg-submit" onclick="UI.handleLogin()">连接服务器</button>
      <div class="hint">
        凭据仅缓存在本机浏览器中，不会上传。<br>
        首次使用：游戏内 <code>!设置 密码</code> 设定密码，<br>
        然后 <code>!info myinfo</code> 获取 SteamID。
      </div>
    </div>
  </div>

  <div id="panels-wrap">
  <!-- 仓库面板 -->
  <div class="tab-panel active" id="panel-warehouse">
    <input class="wh-search" id="wh-search" type="text" placeholder="搜索物品…" oninput="renderWarehouse()">
    <div class="wh-bar" id="wh-bar" style="display:none">
      <button onclick="Warehouse.saveAllNoArg()">存入全部</button>
      <button id="wh-refresh" onclick="Warehouse.load()">刷新</button>
      <span class="spacer"></span>
      <button id="wh-showall-btn" onclick="Warehouse.toggleShowAll()">显示未拥有</button>
      <button id="wh-fmt-btn" onclick="Warehouse.toggleNumFmt()">简洁</button>
    </div>
    <div id="wh-categories"></div>
    <div class="wh-empty" id="wh-empty" style="display:none">没有匹配的物品</div>
  </div>

  <!-- 占位面板 -->
  <div class="tab-panel" id="panel-trade"><div class="placeholder"><span class="ph-icon">💰</span><span class="ph-text">交易面板 — 即将开放</span></div></div>
  <div class="tab-panel" id="panel-shipyard"><div class="placeholder"><span class="ph-icon">🏭</span><span class="ph-text">船厂面板 — 即将开放</span></div></div>
  <div class="tab-panel" id="panel-hangar"><div class="placeholder"><span class="ph-icon">🚁</span><span class="ph-text">船坞面板 — 即将开放</span></div></div>
  <div class="tab-panel" id="panel-settings"><div class="placeholder"><span class="ph-icon">⚙</span><span class="ph-text">设置 — 即将开放</span></div></div>
  </div><!-- /#panels-wrap -->
  <div id="tab-dots"></div>
</div>

<!-- 底部 Tab 栏 -->
<div id="tabbar">
  <div class="tab active" data-tab="warehouse"><span class="tab-icon">📦</span>仓库</div>
  <div class="tab" data-tab="trade"><span class="tab-icon">💰</span>交易</div>
  <div class="tab" data-tab="shipyard"><span class="tab-icon">🏭</span>船厂</div>
  <div class="tab" data-tab="hangar"><span class="tab-icon">🚁</span>船坞</div>
  <div class="tab" data-tab="settings"><span class="tab-icon">⚙</span>设置</div>
</div>

<!-- 数量输入 Bottom Sheet -->
<div id="qsheet-overlay">
  <div id="qsheet">
    <div class="qs-tabs" id="qs-tabs">
      <button class="qs-tab active" id="qs-tab-deposit">存入</button>
      <button class="qs-tab" id="qs-tab-withdraw">取出</button>
    </div>
    <div class="qs-display">
      <div class="qs-name" id="qs-item"></div>
      <span class="qs-stock" id="qs-stock"></span>
    </div>
    <div class="qs-btns">
      <button class="qs-sub qs-fast" id="qs-minus-fast" title="快速减少">−−</button>
      <button class="qs-sub" id="qs-minus" title="减少">−</button>
      <input id="qs-qty" type="number" value="100" min="1" oninput="UI.onQtyInput()">
      <button class="qs-add" id="qs-plus" title="增加">+</button>
      <button class="qs-add qs-fast" id="qs-plus-fast" title="快速增加">++</button>
    </div>
    <div class="qs-actions">
      <button class="qs-cancel" onclick="UI.closeQSheet()">取消</button>
      <button class="qs-confirm" id="qs-confirm" onclick="UI.confirmQSheet()">确认存入</button>
    </div>
  </div>
</div>

<!-- 断开确认弹窗 -->
<div id="dc-overlay">
  <div id="dc-dialog">
    <div class="dc-icon">⚠</div>
    <div class="dc-msg">断开后将需要重新输入密码才能执行指令。<br>确定要断开连接吗？</div>
    <div class="dc-actions">
      <button class="dc-cancel" onclick="UI.closeDcDialog()">取消</button>
      <button class="dc-confirm" onclick="UI.confirmDisconnect()">断开</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"><span id="toast-body"></span><button class="t-close" onclick="UI.hideToast()">&times;</button></div>

<script src="js/se-bridge.js"></script>
<script src="version-check.js"></script>
<script src="js/ui.js"></script>
<script src="js/warehouse.js"></script>
<script>
// ========== 伊卡洛斯虚空终端 — 入口 ==========
SeBridge.init({ bridgeUrl: '' });

// 版本哈希从 version.json 自动提取
fetch('/version.json?t=' + Date.now())
  .then(function(r){ return r.ok ? r.json() : null; })
  .then(function(d){ if (d && d.v) document.getElementById('logo-hash').textContent = d.v.slice(0, 7); })
  .catch(function(){});

// 初始化模块
UI.init();
Warehouse.init();

// Tab 回调 → 仓库加载
UI.onTabChange('warehouse', function(){ Warehouse.onTabActivated(); });

// 后台轮询
setTimeout(function(){
  UI.pollHealth();
  setInterval(UI.pollHealth, 30000);
  setInterval(UI.updateGauge, 5000);
}, 100);

// 初始状态
if (SeBridge.hasCredentials()) {
  UI.onLoginSuccess();
} else {
  UI.showLoginGuide();
}
</script>
</body>
</html>
