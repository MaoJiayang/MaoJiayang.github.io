<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>伊卡洛斯虚空终端</title>
<link rel="stylesheet" href="icons/sprite.css">
<style>
/* ========== 须弥风格变量 ========== */
:root {
  --bg-void:      #0B0F14;
  --bg-deep:      #111921;
  --bg-panel:     #182331;
  --bg-card:      #1E2D3D;
  --bg-hover:     #253748;
  --jade-600:     #1B6B4A;
  --jade-400:     #2EA870;
  --jade-200:     #5DDDAA;
  --jade-100:     #9FFADA;
  --jade-50:      #D0FFF0;
  --blue-200:     #5B9EF0;
  --blue-100:     #9DCFFF;
  --gold-200:     #F0BE3A;
  --gold-400:     #C48A0A;
  --color-success: #5DDDAA;
  --color-info:    #5B9EF0;
  --color-warn:    #F0BE3A;
  --color-error:   #F07070;
  --color-arcane:  #B07AE0;
  --text-primary:   #E8F4EE;
  --text-secondary: #A8C4B8;
  --text-muted:     #6A8C80;
  --text-disabled:  #3A5A50;
  /* 兼容 commands.html 的变量名（给 version-check.js 用） */
  --border: var(--bg-hover);
  --text-main: var(--text-primary);
  --accent: var(--jade-200);
  --font-mono: "JetBrains Mono", Consolas, monospace;
  --font-sans: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --tab-h: 56px;
  --topbar-h: 44px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font-sans);
  background:var(--bg-void);
  color:var(--text-primary);
  min-height:100vh;
  min-height:100dvh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ========== 全局顶栏 ========== */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:var(--topbar-h);
  background:var(--bg-deep);
  border-bottom:1px solid var(--bg-hover);
  display:flex;align-items:center;
  padding:0 12px;gap:10px;
}
#topbar .logo{
  font-family:var(--font-mono);font-size:13px;font-weight:600;
  color:var(--jade-200);letter-spacing:0.04em;white-space:nowrap;
}
.logo-hash{font-size:10px;font-weight:400;color:var(--text-disabled);margin-left:6px;letter-spacing:0}
#topbar .spacer{flex:1}
#topbar .gauge-wrap{
  display:flex;align-items:center;gap:5px;font-size:10.5px;
  font-family:var(--font-mono);color:var(--text-muted);
}
.gauge-bar{width:28px;height:4px;border-radius:2px;background:var(--bg-hover);overflow:hidden}
.gauge-fill{display:block;height:100%;border-radius:2px;background:var(--jade-200);transition:width .3s,background .3s}
.gauge-fill.low{background:var(--color-error)}
.gauge-fill.mid{background:var(--color-warn)}
#user-badge{
  font-size:11px;color:var(--text-muted);cursor:pointer;
  padding:3px 8px;border-radius:12px;border:1px solid var(--bg-hover);
  background:var(--bg-panel);transition:border-color .2s,color .2s;
  white-space:nowrap;
}
#user-badge:hover{color:var(--text-primary);border-color:var(--jade-400)}
#user-badge.logged-in{color:var(--jade-200);border-color:var(--jade-600)}
.conn-dot{
  display:inline-block;width:8px;height:8px;border-radius:50%;
  background:#8b949e;flex-shrink:0;transition:background .3s;
}
.conn-dot.online{background:#4ade80;box-shadow:0 0 6px rgba(74,222,128,.5)}
.conn-dot.offline{background:#f85149}

/* ========== 主内容区 ========== */
#main{
  padding-top:var(--topbar-h);
  padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom, 0px));
  min-height:100vh;min-height:100dvh;
}

/* ========== 登录引导页 ========== */
#login-guide{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:calc(100vh - var(--topbar-h) - var(--tab-h));
  min-height:calc(100dvh - var(--topbar-h) - var(--tab-h));
  padding:32px 24px;text-align:center;
}
#login-guide .hero-icon{font-size:48px;margin-bottom:16px}
#login-guide h2{
  font-family:var(--font-mono);font-size:20px;color:var(--jade-200);
  margin-bottom:8px;letter-spacing:0.04em;
}
#login-guide .subtitle{font-size:13px;color:var(--text-muted);margin-bottom:24px;line-height:1.6}
#login-guide .login-card{
  background:var(--bg-panel);border:1px solid var(--bg-hover);border-radius:8px;
  padding:24px;width:100%;max-width:380px;text-align:left;
}
.login-card .field{margin-bottom:14px}
.login-card label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:4px;font-weight:600}
.login-card input[type=text],.login-card input[type=password]{
  width:100%;padding:9px 12px;font-size:14px;
  border:1px solid var(--bg-hover);border-radius:4px;
  background:var(--bg-deep);color:var(--text-primary);
  font-family:var(--font-mono);outline:none;
  transition:border-color .2s;
}
.login-card input:focus{border-color:var(--jade-400)}
.login-card .chk-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-muted);cursor:pointer}
.login-card .err{background:rgba(240,112,112,.1);border:1px solid rgba(240,112,112,.3);border-radius:4px;padding:8px 12px;font-size:12px;color:var(--color-error);margin-bottom:14px;display:none}
.login-card .err.show{display:block}
.login-card .btn-primary{
  width:100%;padding:10px;font-size:14px;font-weight:600;
  background:var(--jade-200);color:var(--bg-void);border:none;
  border-radius:4px;cursor:pointer;font-family:inherit;
  transition:background .2s;
}
.login-card .btn-primary:hover{background:var(--jade-400)}
.login-card .btn-primary:disabled{opacity:.5;cursor:not-allowed}
.login-card .hint{
  margin-top:12px;font-size:11px;color:var(--text-muted);line-height:1.6;
  padding:8px;background:var(--bg-deep);border-radius:4px;border:1px solid var(--bg-hover);
}
.login-card .hint code{
  font-family:var(--font-mono);font-size:11px;background:var(--bg-panel);
  padding:1px 4px;border-radius:2px;color:var(--jade-200);
}

/* ========== Tab 内容面板 ========== */
.tab-panel{
  padding:16px;opacity:0;transform:translateY(8px);
  transition:opacity .25s,transform .25s;
  pointer-events:none;position:absolute;top:0;left:0;right:0;
}
.tab-panel.active{opacity:1;transform:translateY(0);pointer-events:auto;position:relative}
#panels-wrap{position:relative;min-height:300px}
/* 位置指示点 */
#tab-dots{display:flex;justify-content:center;gap:8px;padding:4px 0 8px}
#tab-dots .dot{width:6px;height:6px;border-radius:50%;background:var(--text-disabled);transition:all .2s}
#tab-dots .dot.active{background:var(--jade-200);width:18px;border-radius:3px}
@media(min-width:768px){#tab-dots{display:none}}

/* ========== 仓库面板 ========== */
.wh-search{
  width:100%;padding:9px 12px;font-size:14px;
  border:1px solid var(--bg-hover);border-radius:4px;
  background:var(--bg-deep);color:var(--text-primary);
  font-family:inherit;outline:none;margin-bottom:14px;
  transition:border-color .2s;
}
.wh-search:focus{border-color:var(--jade-400)}
.wh-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:12px;color:var(--text-muted);user-select:none}
.wh-bar .spacer{flex:1}
.wh-bar button{font-size:11px;padding:4px 10px;min-height:30px;border-radius:4px;border:1px solid var(--bg-hover);background:var(--bg-card);color:var(--text-secondary);cursor:pointer;font-family:inherit;transition:all .15s}
.wh-bar button:hover{background:var(--bg-hover);color:var(--text-primary)}
.wh-bar button.active{border-color:var(--jade-400);color:var(--jade-200);background:var(--bg-panel)}
.wh-cat{margin-bottom:12px}
.wh-cat-h{
  display:flex;align-items:center;gap:8px;padding:8px 0;
  font-size:13px;font-weight:600;color:var(--text-secondary);
  cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
  border-bottom:1px solid var(--bg-hover);
}
.wh-cat-h .arrow{display:inline-block;font-size:11px;transition:transform .2s;color:var(--text-muted);width:14px;text-align:center}
.wh-cat-h .arrow.open{transform:rotate(90deg)}
.wh-cat-h .cat-spacer{flex:1}
.wh-cat-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.wh-cat-count{font-size:11px;color:var(--text-muted);margin-left:4px}
.wh-cat-save{
  font-size:12px;padding:5px 12px;min-height:34px;min-width:48px;
  border-radius:4px;border:1px solid var(--bg-hover);
  background:var(--bg-card);color:var(--jade-200);cursor:pointer;
  font-family:inherit;white-space:nowrap;transition:all .15s;
  -webkit-tap-highlight-color:transparent;
}
.wh-cat-save:hover{background:var(--bg-hover);border-color:var(--jade-400)}
.wh-cat-body{display:none}
.wh-cat-body.open{display:block}
/* 网格布局 */
.wh-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:4px 0}
@media(min-width:480px){.wh-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:768px){.wh-grid{grid-template-columns:repeat(4,1fr)}}
.wh-card{
  background:var(--bg-card);border:1px solid var(--bg-hover);border-radius:6px;
  padding:10px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;
  cursor:pointer;transition:all .15s;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.wh-card:hover,.wh-card:active{background:var(--bg-hover);border-color:var(--jade-400)}
.wh-card.zero{opacity:.45}
.wh-card.zero .wh-card-amt{color:var(--text-disabled)}
.wh-card-icon{width:32px;height:32px;border-radius:4px;flex-shrink:0}
.wh-card-icon-fb{
  width:32px;height:32px;border-radius:4px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;color:var(--jade-50);
}
.wh-card-name{font-size:11px;color:var(--text-secondary);text-align:center;line-height:1.3}
.wh-card-amt{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--text-primary)}
.wh-num-sfx{font-size:10px;font-weight:700;margin-left:1px}
.wh-num-sfx.num-k{color:var(--jade-200)}
.wh-num-sfx.num-m{color:var(--gold-200)}
.wh-num-sfx.num-b{color:var(--color-arcane)}
.wh-empty{padding:32px;text-align:center;color:var(--text-muted);font-size:13px}

/* ========== 数量输入 Bottom Sheet ========== */
#qsheet-overlay{
  position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.5);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
#qsheet-overlay.show{opacity:1;pointer-events:auto}
#qsheet{
  background:var(--bg-panel);border:1px solid var(--bg-hover);
  border-radius:12px 12px 0 0;width:100%;max-width:480px;
  padding:20px 20px calc(20px + env(safe-area-inset-bottom, 0px));
  transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);
}
#qsheet-overlay.show #qsheet{transform:translateY(0)}
#qsheet .qs-tabs{display:flex;gap:0;margin-bottom:16px;border-radius:6px;overflow:hidden;border:1px solid var(--bg-hover)}
#qsheet .qs-tab{
  flex:1;padding:8px;font-size:13px;font-weight:600;text-align:center;
  background:var(--bg-card);color:var(--text-muted);border:none;cursor:pointer;
  font-family:inherit;transition:all .15s;
}
#qsheet .qs-tab.active{background:var(--jade-200);color:var(--bg-void)}
#qsheet .qs-tab:disabled{opacity:.35;cursor:not-allowed}
#qsheet .qs-display{text-align:center;margin-bottom:14px}
#qsheet .qs-display .qs-name{font-size:15px;font-weight:600;color:var(--text-primary);margin-bottom:2px}
#qsheet .qs-display .qs-stock{font-size:12px;color:var(--text-muted);font-family:var(--font-mono)}
#qsheet .qs-btns{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:20px}
#qsheet .qs-btns button{
  width:44px;height:44px;border-radius:8px;border:1px solid var(--bg-hover);
  background:var(--bg-card);color:var(--text-primary);cursor:pointer;
  font-family:var(--font-mono);font-size:16px;font-weight:600;
  transition:all .12s;display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
#qsheet .qs-btns button:active{background:var(--bg-hover);transform:scale(.94)}
#qsheet .qs-btns .qs-sub{color:var(--color-warn)}
#qsheet .qs-btns .qs-add{color:var(--jade-200)}
#qsheet .qs-btns .qs-fast{font-size:18px;letter-spacing:-0.06em}
#qsheet .qs-btns input{
  width:90px;padding:10px 4px;font-size:18px;text-align:center;
  border:1px solid var(--bg-hover);border-radius:6px;
  background:var(--bg-deep);color:var(--text-primary);
  font-family:var(--font-mono);font-weight:600;outline:none;
}
#qsheet .qs-btns input:focus{border-color:var(--jade-400)}
#qsheet .qs-actions{display:flex;gap:10px}
#qsheet .qs-actions button{
  flex:1;padding:12px;font-size:14px;font-weight:600;
  border-radius:6px;border:none;cursor:pointer;font-family:inherit;
}
#qsheet .qs-confirm{background:var(--jade-200);color:var(--bg-void)}
#qsheet .qs-confirm:active{background:var(--jade-400)}
#qsheet .qs-cancel{background:var(--bg-card);color:var(--text-secondary);border:1px solid var(--bg-hover)!important}
#qsheet .qs-cancel:active{background:var(--bg-hover)}

/* ========== Toast ========== */
#toast{
  position:fixed;z-index:300;left:50%;bottom:100px;
  transform:translateX(-50%) translateY(16px);
  max-width:420px;width:calc(100% - 32px);
  background:var(--bg-panel);border:1px solid var(--bg-hover);
  border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.25);
  padding:12px 14px;font-size:13px;display:flex;align-items:flex-start;gap:8px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#toast.success{border-left:3px solid var(--color-success)}
#toast.error{border-left:3px solid var(--color-error)}
#toast.warning{border-left:3px solid var(--color-warn)}
#toast .t-close{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:16px;flex-shrink:0}

/* ========== 底部 Tab 栏 (移动端) ========== */
#tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  height:var(--tab-h);padding-bottom:env(safe-area-inset-bottom, 0px);
  background:var(--bg-deep);border-top:1px solid var(--bg-hover);
  display:flex;align-items:center;
}
#tabbar .tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;height:var(--tab-h);cursor:pointer;color:var(--text-muted);
  font-size:10px;transition:color .15s;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
#tabbar .tab .tab-icon{font-size:18px;line-height:1}
#tabbar .tab.active{color:var(--jade-200)}

/* ========== 桌面端侧边栏 ========== */
#sidebar{
  display:none;
  position:fixed;left:0;top:var(--topbar-h);bottom:0;z-index:90;
  width:180px;background:var(--bg-deep);border-right:1px solid var(--bg-hover);
  flex-direction:column;padding:12px 0;
}
#sidebar .sitem{
  display:flex;align-items:center;gap:10px;padding:10px 20px;
  font-size:13px;color:var(--text-muted);cursor:pointer;
  transition:all .15s;border-left:2px solid transparent;
}
#sidebar .sitem:hover{color:var(--text-primary);background:var(--bg-panel)}
#sidebar .sitem.active{color:var(--jade-200);border-left-color:var(--jade-200);background:var(--bg-panel)}
#sidebar .sitem .sitem-icon{font-size:16px;width:20px;text-align:center}

/* ========== 占位面板 ========== */
.placeholder{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:50vh;color:var(--text-muted);text-align:center;gap:8px;
}
.placeholder .ph-icon{font-size:36px;opacity:.5}
.placeholder .ph-text{font-size:13px}

/* ========== 断开确认弹窗 ========== */
#dc-overlay{
  position:fixed;inset:0;z-index:250;background:rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
#dc-overlay.show{opacity:1;pointer-events:auto}
#dc-dialog{
  background:var(--bg-panel);border:1px solid var(--bg-hover);
  border-radius:8px;width:320px;max-width:90vw;padding:24px;text-align:center;
}
#dc-dialog .dc-icon{font-size:36px;margin-bottom:10px}
#dc-dialog .dc-msg{font-size:14px;color:var(--text-secondary);margin-bottom:20px;line-height:1.5}
#dc-dialog .dc-actions{display:flex;gap:8px}
#dc-dialog .dc-actions button{
  flex:1;padding:10px;font-size:14px;font-weight:600;
  border-radius:4px;border:none;cursor:pointer;font-family:inherit;
}
#dc-dialog .dc-confirm{background:var(--color-error);color:#fff}
#dc-dialog .dc-confirm:hover{opacity:.85}
#dc-dialog .dc-cancel{background:var(--bg-card);color:var(--text-secondary);border:1px solid var(--bg-hover)!important}
#dc-dialog .dc-cancel:hover{background:var(--bg-hover)}

/* ========== 响应式 ========== */
@media(min-width:768px){
  #sidebar{display:flex}
  #tabbar{display:none}
  #main{margin-left:180px;padding-bottom:0}
  #login-guide{min-height:calc(100vh - var(--topbar-h))}
}
</style>
</head>
<body>

<!-- 全局顶栏 -->
<div id="topbar">
  <span class="logo">◈ 虚空终端<span class="logo-hash" id="logo-hash"></span></span>
  <span class="spacer"></span>
  <span class="conn-dot" id="conn-dot" title="检测中"></span>
  <span class="gauge-bar" id="gauge-bar" style="display:none"><span class="gauge-fill" id="gauge-fill"></span></span>
  <span id="user-badge" onclick="handleUserBadgeClick()">未登录</span>
</div>

<!-- 桌面侧边栏 -->
<nav id="sidebar">
  <div class="sitem active" data-tab="warehouse"><span class="sitem-icon">📦</span>仓库</div>
  <div class="sitem" data-tab="trade"><span class="sitem-icon">💰</span>交易</div>
  <div class="sitem" data-tab="shipyard"><span class="sitem-icon">🏭</span>船厂</div>
  <div class="sitem" data-tab="hangar"><span class="sitem-icon">🚁</span>船坞</div>
  <div class="sitem" data-tab="settings"><span class="sitem-icon">⚙</span>设置</div>
</nav>

<!-- 主内容区 -->
<div id="main">
  <!-- 登录引导 -->
  <div id="login-guide">
    <div class="hero-icon">🌿</div>
    <h2>伊卡洛斯虚空终端</h2>
    <p class="subtitle">连接至伊卡洛斯星服务器<br>可视化操作你的星际资产</p>
    <div class="login-card">
      <div class="field">
        <label for="lg-steamid">SteamID</label>
        <input id="lg-steamid" type="text" placeholder="在游戏内输入 !info myinfo 获取" autocomplete="off">
      </div>
      <div class="field">
        <label for="lg-pwd">游戏密码</label>
        <input id="lg-pwd" type="password" placeholder="你的游戏密码" autocomplete="off">
      </div>
      <div class="field">
        <label class="chk-row"><input id="lg-remember" type="checkbox" checked><span>记住密码（加密保存在本机）</span></label>
      </div>
      <div class="err" id="lg-err"></div>
      <button class="btn-primary" id="lg-submit" onclick="handleLogin()">连接服务器</button>
      <div class="hint">
        凭据仅缓存在本机浏览器中，不会上传。<br>
        首次使用：游戏内 <code>!设置 密码</code> 设定密码，<br>
        然后 <code>!info myinfo</code> 获取 SteamID。
      </div>
    </div>
  </div>

  <div id="panels-wrap">
  <!-- 仓库面板 -->
  <div class="tab-panel active" id="panel-warehouse">
    <input class="wh-search" id="wh-search" type="text" placeholder="搜索物品…" oninput="renderWarehouse()">
    <div class="wh-bar" id="wh-bar" style="display:none">
      <button onclick="quickAction('存入全部')">存入全部</button>
      <button id="wh-refresh" onclick="loadWarehouse()">刷新</button>
      <span class="spacer"></span>
      <button id="wh-showall-btn" onclick="toggleShowAll()">显示未拥有</button>
      <button id="wh-fmt-btn" onclick="toggleNumFmt()">简洁</button>
    </div>
    <div id="wh-categories"></div>
    <div class="wh-empty" id="wh-empty" style="display:none">没有匹配的物品</div>
  </div>

  <!-- 占位面板 -->

<script src="se-bridge.js"></script>
<script src="version-check.js"></script>
<script>
// ========== 图标映射 ==========
var iconMap = {};    // ChineseName → iconFilename
var catColors = {    // 分类色（用于无图标回退）
  '矿石': '#7A4D00',   // 暗金
  '矿锭': '#C48A0A',   // 金
  '零件': '#1B6B4A',   // 翠绿
  '弹药': '#1A3E7A',   // 深蓝
  '工具': '#2E6BC4',   // 蓝
  '消耗品': '#B07AE0', // 紫
  '其他': '#253748'     // 灰
};

fetch('icons/mapping.json')
  .then(function(r){ return r.json() })
  .then(function(m){ iconMap = m; })
  .catch(function(){ console.warn('图标映射加载失败'); });

// ========== 物品分类加载 ==========
var itemCategories = {};
fetch('items_catalog.json')
  .then(function(r){ return r.json() })
  .then(function(cat){ itemCategories = cat; })
  .catch(function(){ console.warn('items_catalog.json 加载失败，使用默认分组'); });

function getItemCategory(name) {
  for (var cat in itemCategories) {
    if (itemCategories[cat].indexOf(name) !== -1) return cat;
  }
  return '其他';
}

// ========== 全局状态 ==========
var currentTab = 'warehouse';
var warehouseData = null;       // { items: { name: amount }, steamId }
var warehouseLoading = false;
var warehouseOpenCat = null;    // 记住展开的分类，null=展开第一个
var warehouseShowAll = false;   // 是否显示库存为0的物品
var warehouseCompactNum = false; // 简洁数字 k/M/B
var qsheetMode = 'deposit';     // 'deposit' | 'withdraw'
var qsheetItem = '';
var qsheetStock = 0;           // 仓库中该物品的当前数量
var qsheetQty = 100;
var _tapCount = 0;
var _lastTapTime = 0;
var _tapTimer = null;
var _tapStep = 10;             // ++ 当前步长
var toastTimer = null;

// ========== 初始化 ==========
SeBridge.init({ bridgeUrl: '' });

// 延迟启动后台轮询
setTimeout(function(){
  pollHealth();                    // 首次连接检测
  setInterval(pollHealth, 30000);  // 每 30s 检测
  setInterval(updateGauge, 5000);  // 每 5s 更新用量
}, 100);

// ========== 顶栏/状态 ==========
function setConnDot(state) {
  var dot = document.getElementById('conn-dot');
  dot.className = 'conn-dot' + (state ? ' ' + state : '');
  dot.title = state === 'online' ? '服务在线' : state === 'offline' ? '服务离线' : '检测中';
}

function pollHealth() {
  SeBridge.checkBridgeHealth().then(function(r){
    setConnDot(r !== null && r.code === 200 ? 'online' : 'offline');
  }).catch(function(){
    setConnDot('offline');
  });
}

function updateGauge() {
  var bar = document.getElementById('gauge-bar');
  if (!SeBridge.hasCredentials()) {
    bar.style.display = 'none';
    return;
  }
  bar.style.display = 'inline-block';
  var remain = SeBridge.getRemainingCalls();
  var limit = SeBridge.getRateLimit();
  var pct = (remain / limit) * 100;
  var fill = document.getElementById('gauge-fill');
  fill.style.width = pct + '%';
  fill.className = 'gauge-fill' + (pct <= 20 ? ' low' : pct <= 50 ? ' mid' : '');
}

function updateUserBadge() {
  var el = document.getElementById('user-badge');
  if (SeBridge.hasCredentials()) {
    el.textContent = '已连接';
    el.classList.add('logged-in');
  } else {
    el.textContent = '未登录';
    el.classList.remove('logged-in');
  }
  updateGauge();
}

function handleUserBadgeClick() {
  if (SeBridge.hasCredentials()) {
    // 弹出确认弹窗
    document.getElementById('dc-overlay').classList.add('show');
  } else {
    showLoginGuide();
  }
}

function closeDcDialog() {
  document.getElementById('dc-overlay').classList.remove('show');
}

function confirmDisconnect() {
  closeDcDialog();
  SeBridge.clearCredentials();
  updateUserBadge();
  showLoginGuide();
  showToast('success', '已断开连接');
}

// ========== 登录 ==========
function showLoginGuide() {
  document.getElementById('login-guide').style.display = 'flex';
  document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
  document.getElementById('tabbar').style.display = 'none';
}

function hideLoginGuide() {
  document.getElementById('login-guide').style.display = 'none';
  document.getElementById('tabbar').style.display = 'flex';
  switchTab(currentTab);
}

function handleLogin() {
  var steamId = document.getElementById('lg-steamid').value.trim();
  var pwd = document.getElementById('lg-pwd').value.trim();
  var remember = document.getElementById('lg-remember').checked;
  var errEl = document.getElementById('lg-err');
  var btn = document.getElementById('lg-submit');

  if (!steamId) { showLoginErr('请输入 SteamID'); return; }
  if (!pwd) { showLoginErr('请输入游戏密码'); return; }

  btn.disabled = true;
  btn.textContent = '正在验证…';
  errEl.classList.remove('show');

  SeBridge.verifyCredentials(steamId, pwd).then(function(r){
    btn.disabled = false;
    btn.textContent = '连接服务器';
    if (r.code === 200) {
      SeBridge.saveCredentials(steamId, pwd, remember);
      SeBridge.syncUser().catch(function(){});
      onLoginSuccess();
    } else {
      showLoginErr(r.msg || '验证失败');
    }
  }).catch(function(){
    btn.disabled = false;
    btn.textContent = '连接服务器';
    showLoginErr('连接失败，请稍后重试');
  });
}

function showLoginErr(msg) {
  var el = document.getElementById('lg-err');
  el.textContent = msg;
  el.classList.add('show');
}

function onLoginSuccess() {
  hideLoginGuide();
  updateUserBadge();
  updateGauge();
  document.getElementById('wh-bar').style.display = '';
  showToast('success', '已连接至伊卡洛斯星服务器');
  if (currentTab === 'warehouse') loadWarehouse();
}

// ========== Tab 切换 ==========
function switchTab(tab) {
  var sameTab = tab === currentTab;
  currentTab = tab;
  document.querySelectorAll('#sidebar .sitem').forEach(function(s){
    s.classList.toggle('active', s.dataset.tab === tab);
  });
  document.querySelectorAll('#tabbar .tab').forEach(function(t){
    t.classList.toggle('active', t.dataset.tab === tab);
  });
  var switching = !sameTab || !document.querySelector('.tab-panel.active');
  if (switching) {
    document.querySelectorAll('.tab-panel').forEach(function(p){
      p.classList.remove('active');
    });
    var panel = document.getElementById('panel-' + tab);
    if (panel) panel.classList.add('active');
  }
  updateTabDots();
  if (tab === 'warehouse' && !warehouseData) loadWarehouse();
}

function updateTabDots() {
  var dots = document.getElementById('tab-dots');
  if (!dots) return;
  var html = '';
  TAB_ORDER.forEach(function(t){
    html += '<span class="dot' + (t === currentTab ? ' active' : '') + '"></span>';
  });
  dots.innerHTML = html;
}

document.querySelectorAll('#sidebar .sitem').forEach(function(s){
  s.addEventListener('click', function(){ switchTab(s.dataset.tab); });
});
document.querySelectorAll('#tabbar .tab').forEach(function(t){
  t.addEventListener('click', function(){ switchTab(t.dataset.tab); });
});

// ========== 移动端左右滑动切换 Tab ==========
var TAB_ORDER = ['warehouse','trade','shipyard','hangar','settings'];
(function(){
  var startX = 0, startY = 0, swiping = false;
  var main = document.getElementById('main');

  main.addEventListener('touchstart', function(e){
    // 弹窗内不处理
    if (e.target.closest('#qsheet-overlay') || e.target.closest('#dc-overlay')) return;
    // 可滚动元素内不处理（让用户正常滚动面板）
    if (e.target.closest('.wh-grid') || e.target.closest('.wh-cat-body') ||
        e.target.closest('.sem-card-body') || e.target.closest('.ac-card-body') ||
        e.target.closest('.hist-card-body')) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    swiping = true;
  }, { passive: true });

  main.addEventListener('touchend', function(e){
    if (!swiping) return;
    swiping = false;
    var dx = (e.changedTouches[0] || e.touches[0]).clientX - startX;
    var dy = (e.changedTouches[0] || e.touches[0]).clientY - startY;
    if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;  // 距离不够或纵向为主
    var idx = TAB_ORDER.indexOf(currentTab);
    if (dx < 0 && idx < TAB_ORDER.length - 1) switchTab(TAB_ORDER[idx + 1]);
    else if (dx > 0 && idx > 0) switchTab(TAB_ORDER[idx - 1]);
  });
})();

// ========== 仓库数据 ==========
function loadWarehouse() {
  if (warehouseLoading) return;
  if (!SeBridge.hasCredentials()) return;
  warehouseLoading = true;
  var refreshBtn = document.getElementById('wh-refresh');
  if (refreshBtn) { refreshBtn.textContent = '刷新中…'; refreshBtn.disabled = true; }
  SeBridge.executeCommand('!仓库 列表').then(function(r){
    warehouseLoading = false;
    if (refreshBtn) { refreshBtn.textContent = '刷新'; refreshBtn.disabled = false; }
    if (r.code === 200 && r.data) {
      warehouseData = { items: r.data.items || {}, steamId: r.data.steamId };
      SeBridge.trackCall();
      updateGauge();
      renderWarehouse();
      showToast('success', '库存已刷新');
    } else if (r.code === 401) {
      SeBridge.clearCredentials();
      updateUserBadge();
      showLoginGuide();
      showToast('error', '凭据已过期，请重新登录');
    } else {
      showToast('error', '仓库数据获取失败');
    }
  }).catch(function(){
    warehouseLoading = false;
    if (refreshBtn) { refreshBtn.textContent = '刷新'; refreshBtn.disabled = false; }
    showToast('error', '网络错误，请稍后重试');
  });
}

function renderWarehouse() {
  var container = document.getElementById('wh-categories');
  var emptyEl = document.getElementById('wh-empty');
  var search = (document.getElementById('wh-search').value || '').toLowerCase().trim();

  // 合并仓库数据与物品目录 → 展示所有可操作物品
  var whItems = (warehouseData && warehouseData.items) ? warehouseData.items : {};
  var catOrder = ['矿石','矿锭','零件','弹药','工具','消耗品','其他'];
  var groups = {};
  var hasOwnedItems = Object.keys(whItems).length > 0;

  // 显示/隐藏底部栏
  var bar = document.getElementById('wh-bar');
  if (bar) bar.style.display = SeBridge.hasCredentials() ? '' : 'none';
  var showAllBtn = document.getElementById('wh-showall-btn');
  if (showAllBtn) {
    showAllBtn.textContent = warehouseShowAll ? '隐藏未拥有' : '显示未拥有';
    showAllBtn.classList.toggle('active', warehouseShowAll);
    showAllBtn.style.display = hasOwnedItems ? '' : 'none';
  }
  var fmtBtn = document.getElementById('wh-fmt-btn');
  if (fmtBtn) fmtBtn.textContent = warehouseCompactNum ? '完整' : '简洁';

  catOrder.forEach(function(cat){
    var catalog = itemCategories[cat];
    if (!catalog || catalog.length === 0) return;
    var items = [];
    catalog.forEach(function(name){
      if (search && name.toLowerCase().indexOf(search) === -1) return;
      var amount = whItems.hasOwnProperty(name) ? whItems[name] : 0;
      if (!warehouseShowAll && amount === 0) return;  // 默认隐藏零库存
      items.push({ name: name, amount: amount });
    });
    if (items.length === 0) return;
    items.sort(function(a,b){ return a.name.localeCompare(b.name); });
    groups[cat] = items;
  });

  // 如仓库中有物品未被目录覆盖，归入「其他」
  var covered = {};
  catOrder.forEach(function(cat){ (groups[cat]||[]).forEach(function(i){ covered[i.name] = true; }); });
  var uncat = [];
  Object.keys(whItems).forEach(function(name){
    if (!covered[name] && (!search || name.toLowerCase().indexOf(search) !== -1)) {
      uncat.push({ name: name, amount: whItems[name] });
    }
  });
  if (uncat.length > 0) {
    uncat.sort(function(a,b){ return a.name.localeCompare(b.name); });
    if (!groups['其他']) groups['其他'] = [];
    groups['其他'] = groups['其他'].concat(uncat);
  }

  var totalVisible = 0;
  var hasAny = Object.keys(whItems).length > 0;
  var html = '';
  var openCat = warehouseOpenCat || (catOrder.find(function(c){ return groups[c] && groups[c].length > 0; }) || catOrder[0]);

  catOrder.forEach(function(cat){
    var items = groups[cat];
    if (!items || items.length === 0) return;
    totalVisible += items.length;
    var isOpen = cat === openCat;
    html += '<div class="wh-cat">';
    html += '<div class="wh-cat-h" onclick="toggleCategory(this)">'
      + '<span class="arrow' + (isOpen ? ' open' : '') + '">▸</span>'
      + '<span class="wh-cat-dot" style="background:' + (catColors[cat] || catColors['其他']) + '"></span>'
      + '<span class="wh-cat-label">' + cat + '</span>'
      + '<span class="wh-cat-count">' + items.length + ' 种</span>'
      + '<span class="cat-spacer"></span>'
      + '<button class="wh-cat-save" onclick="event.stopPropagation();saveAllForCat(\'' + cat + '\')">全部存入</button>'
      + '</div>';
    html += '<div class="wh-cat-body' + (isOpen ? ' open' : '') + '"><div class="wh-grid">';
    items.forEach(function(item){
      var compact = warehouseCompactNum;
      var amtNum = typeof item.amount === 'number' ? item.amount : parseInt(item.amount) || 0;
      var display = amtNum === 0 ? '0' : fmtNum(amtNum, compact, null);
      var suffixHtml = '';
      if (compact && amtNum >= 1000) {
        var cls = amtNum >= 1e9 ? 'num-b' : amtNum >= 1e6 ? 'num-m' : 'num-k';
        var sfx = amtNum >= 1e9 ? 'B' : amtNum >= 1e6 ? 'M' : 'k';
        suffixHtml = '<span class="wh-num-sfx ' + cls + '">' + sfx + '</span>';
      }
      var iconHtml = renderCardIcon(item.name);
      var zeroClass = item.amount === 0 ? ' zero' : '';
      html += '<div class="wh-card' + zeroClass + '" onclick="openQSheetWithCard(this,\'' + escAttr(item.name) + '\',' + item.amount + ')">'
        + iconHtml
        + '<span class="wh-card-name">' + escHtml(item.name) + '</span>'
        + '<span class="wh-card-amt">' + escHtml(display) + suffixHtml + '</span>'
        + '</div>';
    });
    html += '</div></div></div>';
    first = false;
  });

  container.innerHTML = html;
  emptyEl.style.display = totalVisible === 0 ? 'block' : 'none';
  if (totalVisible === 0 && hasAny) {
    emptyEl.innerHTML = '没有匹配的物品';
  } else if (totalVisible === 0 && !hasAny) {
    emptyEl.innerHTML = '暂无物品数据<br><span style="font-size:11px;opacity:.6">输入 !仓库 列表 指令获取库存</span>';
  }
}

function toggleShowAll(show) {
  warehouseShowAll = typeof show === 'boolean' ? show : !warehouseShowAll;
  warehouseOpenCat = null;
  renderWarehouse();
}

function toggleNumFmt() {
  warehouseCompactNum = !warehouseCompactNum;
  var btn = document.getElementById('wh-fmt-btn');
  if (btn) btn.textContent = warehouseCompactNum ? '完整' : '简洁';
  renderWarehouse();
}

function fmtNum(n, compact, suffixEl) {
  if (!compact) return n.toLocaleString(undefined, { maximumFractionDigits: 1 });
  var suffix = '', cls = '';
  if (n >= 1e9)      { suffix = 'B'; cls = 'num-b'; n = n / 1e9; }
  else if (n >= 1e6) { suffix = 'M'; cls = 'num-m'; n = n / 1e6; }
  else if (n >= 1e3) { suffix = 'k'; cls = 'num-k'; n = n / 1e3; }
  if (suffixEl) { suffixEl.textContent = suffix; suffixEl.className = 'wh-num-sfx ' + cls; }
  return (n >= 100 ? Math.round(n) : n.toFixed(1).replace(/\.0$/, ''));
}

function toggleCategory(el) {
  var catEl = el.parentElement; // .wh-cat
  var catName = catEl.querySelector('.wh-cat-label').textContent;
  var arrow = el.querySelector('.arrow');
  var body = catEl.querySelector('.wh-cat-body');
  var wasOpen = arrow.classList.contains('open');

  // 手风琴：关闭所有，再根据情况打开当前
  document.querySelectorAll('.wh-cat-h').forEach(function(h){
    h.querySelector('.arrow').classList.remove('open');
    var b = h.parentElement.querySelector('.wh-cat-body');
    if (b) b.classList.remove('open');
  });

  if (!wasOpen) {
    arrow.classList.add('open');
    if (body) body.classList.add('open');
    warehouseOpenCat = catName;
  } else {
    warehouseOpenCat = null;  // 关闭后不展开任何分类
  }
}

// ========== 数量输入面板 ==========
function openQSheet(mode, itemName, stock) {
  qsheetMode = mode;
  qsheetItem = itemName;
  qsheetStock = stock || 0;
  qsheetQty = 100;
  _tapCount = 0;
  _tapStep = 10;
  var depositing = mode === 'deposit';
  var maxWithdraw = depositing ? Infinity : qsheetStock;
  if (qsheetQty > maxWithdraw) qsheetQty = maxWithdraw;
  if (qsheetQty < 1) qsheetQty = 1;
  document.getElementById('qs-item').textContent = itemName;
  document.getElementById('qs-stock').textContent = '库存 ' + qsheetStock.toLocaleString();
  document.getElementById('qs-qty').value = qsheetQty;
  document.getElementById('qs-confirm').textContent = depositing ? '确认存入 ' + qsheetQty.toLocaleString() : '确认取出 ' + qsheetQty.toLocaleString();
  document.getElementById('qsheet-overlay').classList.add('show');
  updateQSheetTabs();
  updateQSheetBtns();
}

function closeQSheet() {
  document.getElementById('qsheet-overlay').classList.remove('show');
  clearTimeout(_tapTimer);
}

function updateQSheetDisplay() {
  document.getElementById('qs-qty').value = qsheetQty;
  document.getElementById('qs-confirm').textContent = (qsheetMode === 'deposit' ? '确认存入 ' : '确认取出 ') + qsheetQty.toLocaleString();
  updateQSheetBtns();
}

function updateQSheetTabs() {
  var tabDep = document.getElementById('qs-tab-deposit');
  var tabWdr = document.getElementById('qs-tab-withdraw');
  tabDep.classList.toggle('active', qsheetMode === 'deposit');
  tabWdr.classList.toggle('active', qsheetMode === 'withdraw');
  tabWdr.disabled = qsheetStock === 0;
}

function onQtyInput() {
  var input = document.getElementById('qs-qty');
  var v = parseInt(input.value) || 1;
  var maxWithdraw = qsheetMode === 'deposit' ? Infinity : qsheetStock;
  qsheetQty = Math.max(1, Math.min(maxWithdraw, v));
  input.value = qsheetQty;
  document.getElementById('qs-confirm').textContent = (qsheetMode === 'deposit' ? '确认存入 ' : '确认取出 ') + qsheetQty.toLocaleString();
  _tapCount = 0; _tapStep = 10;
}

function switchQSheetMode(mode) {
  if (mode === qsheetMode) return;
  if (mode === 'withdraw' && qsheetStock === 0) return;
  qsheetMode = mode;
  qsheetQty = 100;
  var maxWithdraw = mode === 'deposit' ? Infinity : qsheetStock;
  if (qsheetQty > maxWithdraw) qsheetQty = maxWithdraw;
  if (qsheetQty < 1) qsheetQty = 1;
  _tapCount = 0; _tapStep = 10;
  updateQSheetTabs();
  updateQSheetDisplay();
}

function updateQSheetBtns() {
  var maxWithdraw = qsheetMode === 'deposit' ? Infinity : qsheetStock;
  document.getElementById('qs-minus').disabled = qsheetQty <= 1;
  document.getElementById('qs-minus-fast').disabled = qsheetQty <= 1;
  document.getElementById('qs-plus').disabled = qsheetQty >= maxWithdraw;
  document.getElementById('qs-plus-fast').disabled = qsheetQty >= maxWithdraw;
}

function adjustQty(delta) {
  var maxWithdraw = qsheetMode === 'deposit' ? Infinity : qsheetStock;
  qsheetQty = Math.max(1, Math.min(maxWithdraw, qsheetQty + delta));
  updateQSheetDisplay();
}

function fastAdjust(deltaDir) {
  var now = Date.now();
  if (_lastTapTime && now - _lastTapTime < 600) {
    _tapCount++;
    _tapStep = Math.min(1000, 10 * Math.pow(2, _tapCount));
  } else {
    _tapCount = 0;
    _tapStep = 10;
  }
  _lastTapTime = now;
  clearTimeout(_tapTimer);
  _tapTimer = setTimeout(function(){ _tapCount = 0; _tapStep = 10; _lastTapTime = 0; }, 600);
  adjustQty(deltaDir * _tapStep);
}

function confirmQSheet() {
  if (qsheetQty < 1) qsheetQty = 1;
  var cmd = qsheetMode === 'deposit'
    ? '!仓库 存入 ' + qsheetItem + ' ' + qsheetQty
    : '!仓库 取出 ' + qsheetItem + ' ' + qsheetQty;
  closeQSheet();
  executeAndRefresh(cmd, qsheetMode === 'deposit' ? '存入' : '取出');
}

// 按钮绑定
document.getElementById('qs-minus').addEventListener('click', function(){ adjustQty(-1); });
document.getElementById('qs-plus').addEventListener('click', function(){ adjustQty(1); });
document.getElementById('qs-minus-fast').addEventListener('click', function(){ fastAdjust(-1); });
document.getElementById('qs-plus-fast').addEventListener('click', function(){ fastAdjust(1); });

function quickAction(action) {
  var cmd = '!仓库 ' + action;
  executeAndRefresh(cmd, action);
}

// 分类名 → 服务器 storageType 参数（工具→手持物，其他不变）
var catToSaveParam = {
  '工具': '手持物'
};
function saveAllForCat(cat) {
  var param = catToSaveParam[cat] || cat;
  quickAction('存入全部 ' + param);
}

function executeAndRefresh(cmd, label) {
  if (!SeBridge.hasCredentials()) { showLoginGuide(); return; }
  if (SeBridge.isRateLimited()) { showToast('error', '调用次数已用完，请稍后再试'); return; }
  SeBridge.executeCommand(cmd).then(function(r){
    SeBridge.trackCall();
    updateGauge();
    if (r.code === 200) {
      showToast('success', '「' + label + '」指令已发送');
      setTimeout(loadWarehouse, 1500);
    } else {
      showToast('error', r.msg || '指令执行失败');
    }
  }).catch(function(){
    showToast('error', '网络错误');
  });
}

// ========== Toast ==========
function showToast(type, msg) {
  var el = document.getElementById('toast');
  clearTimeout(toastTimer);
  el.className = type + ' show';
  document.getElementById('toast-body').textContent = msg;
  toastTimer = setTimeout(hideToast, 3500);
}

function hideToast() {
  var el = document.getElementById('toast');
  el.classList.remove('show');
}

// ========== 工具函数 ==========
function renderCardIcon(itemName) {
  var iconFile = iconMap[itemName];
  var cat = getItemCategory(itemName);
  var color = catColors[cat] || catColors['其他'];
  var initial = itemName.charAt(0);
  if (iconFile) {
    return '<span class="wh-card-icon si si-' + iconFile + '" title="' + escAttr(itemName) + '"></span>';
  }
  return '<span class="wh-card-icon-fb" style="background:' + color + '">' + initial + '</span>';
}

function openQSheetWithCard(card, itemName, stock) {
  openQSheet('deposit', itemName, stock);
}


function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;'); }

// ========== 点击遮罩关闭 ==========
document.getElementById('qsheet-overlay').addEventListener('click', function(e){
  if (e.target === this) closeQSheet();
});

// ========== 初始状态 ==========
document.getElementById('logo-hash').textContent = '38aebcd'.slice(0, 7);
updateTabDots();
if (SeBridge.hasCredentials()) {
  onLoginSuccess();
} else {
  showLoginGuide();
}
