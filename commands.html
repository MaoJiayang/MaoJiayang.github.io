<style>

  --bg-main: #ebf0f4;

@media (prefers-color-scheme: dark) {

    --border: #2d333b;
    --border-focus: #58a6ff;

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--bg-main);color:var(--text-main);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:1.5rem 2rem;background:var(--bg-panel);min-height:100vh;box-shadow:0 0 15px rgba(0,0,0,0.03);border-left:1px solid var(--border);border-right:1px solid var(--border)}
@keyframes search-pulse{0%,100%{box-shadow:0 0 0 0 rgba(88,166,255,0)}50%{box-shadow:0 0 0 6px rgba(88,166,255,0.18);border-color:var(--border-focus)}}
.search-wrap{position:relative;margin-bottom:1rem}
.search-ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-muted);pointer-events:none;transition:color 0.2s;flex-shrink:0}
.search-wrap:focus-within .search-ic{color:var(--accent)}
#q{width:100%;padding:10px 14px 10px 38px;font-size:14px;border:1px solid var(--border);border-radius:4px;background:var(--bg-main);color:var(--text-main);margin-bottom:0;font-family:inherit;transition:border-color 0.2s,box-shadow 0.2s,background 0.2s;animation:search-pulse 2s ease 0.5s 3}
#q:focus{outline:none;border-color:var(--border-focus);background:var(--bg-panel);box-shadow:0 0 0 3px rgba(88,166,255,0.1)}
@media (prefers-reduced-motion:reduce){#q{animation:none}}
.ftabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:8px;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px dashed var(--border);min-height:130px;align-content:start}
.ftab{display:flex;align-items:center;justify-content:center;font-size:13px;padding:6px 10px;border:1px solid var(--border);border-radius:4px;cursor:pointer;background:var(--bg-panel);color:var(--text-muted);transition:all 0.2s;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,0.02);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none;-webkit-tap-highlight-color:transparent}
.ftab:hover{background:var(--bg-main);color:var(--text-main);border-color:var(--border-focus)}
.ftab.on{background:var(--accent);color:#fff;border-color:var(--accent-active);box-shadow:0 2px 4px rgba(3,102,214,0.2)}
.sec{margin-bottom:2rem;background:var(--bg-panel);border:1px solid var(--border);border-radius:4px;overflow:hidden}
.sec-h{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--bg-main);border-bottom:1px solid var(--border)}

.sec-s{font-size:12px;color:var(--text-muted);margin-left:auto;background:var(--bg-panel);padding:2px 6px;border-radius:3px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}

<script>
const SECTION_META = {
  hangar:     { label: '🚁 存取飞船',    sub: '船坞系统',                  col2: '指令' },
  shipmarket: { label: '🛒 买卖飞船',    sub: '船坞市场',                  col2: '指令' },
  storage:    { label: '📦 存取物资',    sub: '仓库系统',                  col2: '指令' },
  build:      { label: '🏗️ 建造飞船',    sub: '船厂 & 模板',               col2: '指令' },
  trade:      { label: '💱 服营商店',    sub: '服务器出售 & 购买',          col2: '指令' },
  pmarket:    { label: '🏪 玩家市场',    sub: '云市场交易',                 col2: '指令' },
  combat:     { label: '⚔️ 战斗活动',    sub: 'PVE挑战 & PVP决斗',         col2: '指令' },
  mission:    { label: '📋 全服任务',    sub: '全服协作任务',               col2: '指令' },
  finance:    { label: '💰 财务管理',    sub: '银行 · 活跃点 · 兑换码',    col2: '指令' },
  info:       { label: '🔍 查询信息',    sub: '!info 系列 & 矿物扫描',     col2: '指令' },
  grid:       { label: '🛸 网格 & 状态', sub: '模式 · 升空 · 降落 · 位置', col2: '指令' },
  list:       { label: '📝 清单 & 合同', sub: '物品清单 · 玩家合同',        col2: '指令' },
  lcd:        { label: '🖥️ LCD 注入',    sub: '自定义数据关键字',           col2: '配置方式' },
  safe:       { label: '🛡️ 精英工程师',  sub: '特殊许可 & 安全区',          col2: '指令' },
};
const SECTION_ORDER = ['hangar','shipmarket','storage','build','trade','pmarket','combat','mission','finance','info','grid','list','lcd','safe'];

// ---- 渲染工具函数 ----

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// 行内 Markdown：仅处理 **bold** 和 `code`
function renderInline(md) {
  return esc(md)
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
}

// 完整 Markdown 渲染（用于 note 字段）
function renderMd(md) {
  if (!md) return '';
  let s = esc(md)
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[色块 (#[0-9a-fA-F]{6})\]/g, '<span style="display:inline-block;width:13px;height:13px;background:$1;border:1px solid rgba(128,128,128,0.35);border-radius:2px;vertical-align:middle;margin:0 1px;"></span>');
  return s.split(/\n\n+/).map(p => {
    p = p.trim();
    if (!p) return '';
    const lines = p.split('\n').map(l => l.trim()).filter(Boolean);
    // 表格：所有行都以 | 开头和结尾（至少2行：表头+分隔+数据）
    if (lines.length >= 2 && lines.every(l => /^\|.+\|$/.test(l))) {
      let html = '<div style="overflow-x:auto"><table>';
      for (let i = 0; i < lines.length; i++) {
        if (/^\|[-:| ]+\|$/.test(lines[i])) continue; // 跳过分隔行
        const cells = lines[i].replace(/^\||\|$/g, '').split('|').map(c => c.trim());
        const tag = i === 0 ? 'th' : 'td';
        html += '<tr>' + cells.map(c => `<${tag}>${c}</${tag}>`).join('') + '</tr>';
      }
      return html + '</table></div>';
    }
    if (lines.every(l => /^[-•]/.test(l))) {
      return '<ul>' + lines.map(l => `<li>${l.replace(/^[-•]\s*/, '')}</li>`).join('') + '</ul>';
    }
    return '<p>' + lines.join('<br>') + '</p>';
  }).join('');
}

// 从 note Markdown 提取第一个 **heading** 作为 <summary> 文本
function extractSummary(md) {
  const m = md.match(/^\*\*(.*?)\*\*/);
  return m ? m[1] : '展开说明';
}

// note body：去掉首行 **heading**\n\n 后的内容
function noteBody(md) {
  return md.replace(/^\*\*.*?\*\*\n\n?/, '');
}

// 构建单行 <tr>
function buildRow(item) {
  // c2：第一个命令是主命令，其余作别名；非 ! 开头（如 @@ 或参数键）则全部平铺
  let c2Html;
  if (!item.commands[0].startsWith('!')) {
    c2Html = item.commands.map(c => `<span class="cmd">${esc(c)}</span>`).join(' ');
  } else {
    c2Html = `<span class="cmd">${esc(item.commands[0])}</span>`;
    if (item.commands.length > 1) {
      c2Html += `<span class="al">${item.commands.slice(1).map(esc).join(' / ')}</span>`;
    }
  }

  // c1：有 note 显示箭头（可点），无 note 显示占位保持对齐
  let rowClass = 'row';
  let arrowHtml;
  let noteRow = '';
  if (item.note) {
    rowClass += ' clickable';
    const summary = extractSummary(item.note);
    arrowHtml = `<span class="arrow-group"><span class="arrow-summary">${esc(summary)}</span><span class="arrow" id="arrow-${esc(item.id)}" title="${esc(summary)}">▸</span></span>`;
    noteRow = `<tr class="note-row" id="note-${esc(item.id)}" style="display:none"><td colspan="3"><div class="note-body">${renderMd(noteBody(item.note))}</div></td></tr>`;
  } else {
    arrowHtml = '<span class="arrow-placeholder"></span>';
  }

  const c1Html = `<div class="c1-cell">${arrowHtml}<span>${esc(item.title)}</span></div>`;
  const c3Html = renderInline(item.description);

  return `<tr class="${rowClass}" data-id="${esc(item.id)}">
    <td class="r-c1">${c1Html}</td>
    <td class="r-c2">${c2Html}</td>
    <td class="r-c3">${c3Html}</td>
  </tr>${noteRow}`;
}

// 构建整个 section div
function buildSection(secId, items) {
  const m = SECTION_META[secId];
  const rows = items.map(buildRow).join('');
  return `<div class="sec" data-sec="${secId}">
<div class="sec-h"><span class="sec-t">${m.label}</span><span class="sec-s">${m.sub}</span></div>
<table><thead><tr><th style="width:19%">想做什么</th><th style="width:39%">${m.col2}</th><th style="width:42%">说明 / 注意</th></tr></thead><tbody>
${rows}
</tbody></table></div>`;
}

function expand(t) { return syn[t] ? [t, ...syn[t]] : [t]; }

function initSearch() {
  const tabs = document.getElementById('tabs');
  const nores = document.getElementById('nores');
  const q = document.getElementById('q');
  const semPanel = document.getElementById('sem-panel');
  const searchWrap = document.getElementById('search-wrap-container');
  let cur = 'all';
  let semTimer = null;

  // 缓存 DOM 节点以优化搜索性能
  const cachedSecs = Array.from(document.querySelectorAll('.sec')).map(sec => ({
    el: sec,
    id: sec.dataset.sec,
    rows: Array.from(sec.querySelectorAll('tr.row')).map(tr => ({
      el: tr,
      text: tr.textContent.toLowerCase()
    }))
  }));

  // 点击外部隐藏智能联想面板
  document.addEventListener('click', (e) => {
    if (!searchWrap.contains(e.target)) {
      semPanel.classList.remove('show');
    }
  });

  // note 展开/收起切换（事件委托，点击整行）
  function toggleNote(id) {
    const note = document.getElementById('note-' + id);
    const arrow = document.getElementById('arrow-' + id);
    if (!note) return;
    const open = note.style.display !== 'none';
    note.style.display = open ? 'none' : '';
    if (arrow) arrow.classList.toggle('open', !open);
  }

  // cmd 标签点击复制（在 row handler 前注册，stopImmediatePropagation 阻断冒泡）
  document.addEventListener('click', (e) => {
    const cmd = e.target.closest('.cmd, .note-body code');
    if (!cmd) return;
    e.stopImmediatePropagation();
    navigator.clipboard.writeText(cmd.textContent.trim()).then(() => {
      const toast = document.createElement('span');
      toast.textContent = '已复制';
      toast.style.cssText = 'position:fixed;z-index:9999;pointer-events:none;font-size:12px;color:var(--accent);background:var(--bg-panel);border:1px solid var(--border);border-radius:3px;padding:2px 6px;box-shadow:0 2px 6px rgba(0,0,0,0.1);transition:all 0.6s ease-out;opacity:1;transform:translateY(0);';
      toast.style.left = e.clientX + 'px';
      toast.style.top = (e.clientY - 8) + 'px';
      document.body.appendChild(toast);
      requestAnimationFrame(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-28px)';
      });
      setTimeout(() => toast.remove(), 650);
    }).catch(() => {});
  });

  document.addEventListener('click', (e) => {
    const row = e.target.closest('tr.row.clickable');
    if (!row) return;
    toggleNote(row.dataset.id);
  });

  // 恢复焦点时，如果没有改变且有数据，重新展示
  q.addEventListener('focus', () => {
    if (q.value.trim() && semPanel.innerHTML.trim() !== '') {
      semPanel.classList.add('show');
    }
  });

  // 构建筛选 tab
  const cats = [{id:'all',label:'全部'}, ...SECTION_ORDER.map(s => ({id:s,label:SECTION_META[s].label}))];
  cats.forEach(c => {
    const b = document.createElement('button');
    b.className = 'ftab' + (c.id === 'all' ? ' on' : '');
    b.textContent = c.label;
    b.dataset.id = c.id;
    b.onclick = () => {
      cur = c.id;
      document.querySelectorAll('.ftab').forEach(x => x.classList.toggle('on', x.dataset.id === c.id));
      filter();
    };
    tabs.appendChild(b);
  });

  function filter() {
    const v = q.value.toLowerCase().trim();
    const terms = v ? v.split(/\s+/).filter(Boolean) : [];
    let any = false;
    
    cachedSecs.forEach(secObj => {
      if (cur !== 'all' && cur !== secObj.id) { 
        secObj.el.classList.add('hide'); 
        return; 
      }
      let vis = false;
      secObj.rows.forEach(rowObj => {
        const m = !terms.length || terms.every(t => expand(t).some(k => rowObj.text.includes(k)));
        rowObj.el.classList.toggle('hide', !m);
        if (!m) {
          const noteRow = document.getElementById('note-' + rowObj.el.dataset.id);
          if (noteRow) noteRow.style.display = 'none';
          const arrow = document.getElementById('arrow-' + rowObj.el.dataset.id);
          if (arrow) arrow.classList.remove('open');
        }
        if (m) vis = true;
      });
      secObj.el.classList.toggle('hide', !vis);
      if (vis) any = true;
    });
    nores.style.display = any ? 'none' : 'block';
  }

  // 渲染语义搜索结果面板
  function renderSemPanel(results) {
    if (!results || results.length === 0) {
      semPanel.classList.remove('show');
      return;
    }
    const items = results.slice(0, 5).map(r => {
      const secLabel = SECTION_META[r.section] ? SECTION_META[r.section].label : r.section;
      const cmdStr = r.commands.slice(0, 2).map(c => `<code class="cmd">${esc(c)}</code>`).join(' ');
      const rawDesc = r.description ? r.description.replace(/\*\*(.*?)\*\*/g, '$1').replace(/`([^`]+)`/g, '$1') : '';
      const descStr = rawDesc.length > 65 ? esc(rawDesc.substring(0, 65)) + '…' : esc(rawDesc);
      return `<div class="sem-item" data-id="${esc(r.id)}">
        <div class="sem-item-title">${esc(r.title)}<span class="sem-item-sec">${secLabel}</span></div>
        <div class="sem-item-cmd">${cmdStr}</div>
        ${descStr ? `<div class="sem-item-desc">${descStr}</div>` : ''}
      </div>`;
    }).join('');

    semPanel.innerHTML = `<div class="sem-card">
      <div class="sem-card-h">✨ 智能联想
        <button id="sem-close" title="关闭">×</button>
      </div><div class="sem-card-body">${items}</div></div>`;
    semPanel.classList.add('show');

    // 关闭按钮
    document.getElementById('sem-close').onclick = (e) => { 
      e.stopPropagation();
      semPanel.classList.remove('show'); 
    };

    // 点击条目高亮滚动
    semPanel.querySelectorAll('.sem-item').forEach(el => {
      el.addEventListener('click', () => scrollToItem(el.dataset.id));
    });
  }

  // 语义搜索（600ms 防抖）
  function scheduleSemanticSearch(val) {
    clearTimeout(semTimer);
    if (!val) {
      semPanel.classList.remove('show');
      searchWrap.classList.remove('sem-loading');
      return;
    }
    semTimer = setTimeout(async () => {
      searchWrap.classList.add('sem-loading');
      try {
        const resp = await fetch(`/search?q=${encodeURIComponent(val)}&n=5`);
        if (resp.ok) renderSemPanel(await resp.json());
      } catch (_) {
        // 静默忽略，不影响关键词搜索
      } finally {
        searchWrap.classList.remove('sem-loading');
      }
    }, 600);
  }

  q.addEventListener('input', () => {
    filter();
    scheduleSemanticSearch(q.value.trim());
  });
  filter();
}

// 滚动到指定指令行并短暂高亮
function scrollToItem(id) {
  const row = document.querySelector(`tr.row[data-id="${id}"]`);
  if (!row) return;
  // 确保所在 section 可见
  const sec = row.closest('.sec');
  if (sec) sec.classList.remove('hide');
  row.classList.remove('hide');
  row.scrollIntoView({ behavior: 'smooth', block: 'center' });
  row.classList.add('sem-highlight');
  setTimeout(() => row.classList.remove('sem-highlight'), 2000);
}

// ---- 入口：fetch JSON → 渲染 → 初始化搜索 ----
fetch('commands.json')
  .then(r => r.json())
  .then(data => {
    const grouped = {};
    SECTION_ORDER.forEach(s => grouped[s] = []);
    data.forEach(item => { if (grouped[item.section]) grouped[item.section].push(item); });

    const container = document.getElementById('cmd-sections');
    container.innerHTML = SECTION_ORDER.map(s => buildSection(s, grouped[s])).join('\n');

    initSearch();
  });
</script>
