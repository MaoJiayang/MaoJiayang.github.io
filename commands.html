<style>
:root {
  --bg-main: #ebf0f4;
  --bg-panel: #ffffff;
  --border: #cfd7de;
  --border-focus: #536f86;
  --text-main: #24292e;
  --text-muted: #586069;
  --accent: #0366d6;
  --accent-active: #005cc5;
  --accent-bg: #e6f1fb;
  --font-sans: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-mono: Consolas, "Liberation Mono", Menlo, Courier, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg-main: #121416;
    --bg-panel: #1b1e22;
    --border: #2d333b;
    --border-focus: #58a6ff;

}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--bg-main);color:var(--text-main);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:1.5rem 2rem;background:var(--bg-panel);min-height:100vh;box-shadow:0 0 15px rgba(0,0,0,0.03);border-left:1px solid var(--border);border-right:1px solid var(--border)}
@keyframes search-pulse{0%,100%{box-shadow:0 0 0 0 rgba(88,166,255,0)}50%{box-shadow:0 0 0 6px rgba(88,166,255,0.18);border-color:var(--border-focus)}}
.search-wrap{position:relative;margin-bottom:1rem}
.search-ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-muted);pointer-events:none;transition:color 0.2s;flex-shrink:0}
.search-wrap:focus-within .search-ic{color:var(--accent)}
#q{width:100%;padding:10px 14px 10px 38px;font-size:14px;border:1px solid var(--border);border-radius:4px;background:var(--bg-main);color:var(--text-main);margin-bottom:0;font-family:inherit;transition:border-color 0.2s,box-shadow 0.2s,background 0.2s;animation:search-pulse 2s ease 0.5s 3}
#q:focus{outline:none;border-color:var(--border-focus);background:var(--bg-panel);box-shadow:0 0 0 3px rgba(88,166,255,0.1)}
@media (prefers-reduced-motion:reduce){#q{animation:none}}
.ftabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:8px;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px dashed var(--border)}
.ftab{display:flex;align-items:center;justify-content:center;font-size:13px;padding:6px 10px;border:1px solid var(--border);border-radius:4px;cursor:pointer;background:var(--bg-panel);color:var(--text-muted);transition:all 0.2s;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,0.02);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftab:hover{background:var(--bg-main);color:var(--text-main);border-color:var(--border-focus)}
.ftab.on{background:var(--accent);color:#fff;border-color:var(--accent-active);box-shadow:0 2px 4px rgba(3,102,214,0.2)}
.sec{margin-bottom:2rem;background:var(--bg-panel);border:1px solid var(--border);border-radius:4px;overflow:hidden}

table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
th{text-align:left;padding:8px 14px;font-size:12px;font-weight:600;color:var(--text-muted);border-bottom:1px solid var(--border)}
tr.row{border-bottom:1px solid var(--border);transition:background 0.15s}
tr.row:last-child{border-bottom:none}
tr.row:hover td{background:var(--bg-main)}
td{padding:12px 14px;vertical-align:top;overflow:hidden}

.c2{width:38%}

.cmd{display:inline-block;background:var(--accent-bg);color:var(--accent);border:1px solid rgba(88,166,255,0.2);border-radius:3px;padding:3px 6px;font-family:var(--font-mono);font-size:12px;font-weight:600;word-break:break-all}
.al{display:block;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:6px;padding-top:6px;border-top:1px dashed var(--border)}

details.note{display:block;margin-top:5px}
details.note summary{display:inline-block;font-size:11px;color:var(--accent);border:1px dashed var(--border);border-radius:3px;padding:1px 7px;cursor:pointer;list-style:none;user-select:none}
details.note summary::-webkit-details-marker{display:none}
details.note .note-body{margin-top:4px;font-size:11.5px;background:var(--bg-main);border:1px solid var(--border);border-radius:4px;padding:6px 10px;line-height:1.7;color:var(--text-muted)}

.sem-item-desc{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-wrap.sem-loading .search-ic{animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:translateY(-50%) rotate(360deg)}}
tr.sem-highlight{animation:row-flash 2s ease}
@keyframes row-flash{0%,100%{background:transparent}15%{background:var(--accent-bg)}}

    <li style="margin-bottom:4px;">指令格式演示中的方括号 <code style="font-family:var(--font-mono);background:var(--bg-panel);padding:1px 4px;border-radius:3px;border:1px solid var(--border);">[]</code> 仅作为参数占位符，实际在游戏中输入时，请<strong>直接写内容，不要输入方括号本身</strong>。</li>

<script>
const SECTION_META = {
  hangar:     { label: '🚁 存取飞船',    sub: '船坞系统',                  col2: '指令' },
  shipmarket: { label: '🛒 买卖飞船',    sub: '船坞市场',                  col2: '指令' },
  storage:    { label: '📦 存取物资',    sub: '仓库系统',                  col2: '指令' },
  build:      { label: '🏗️ 建造飞船',    sub: '船厂 & 模板',               col2: '指令' },
  trade:      { label: '💱 服营商店',    sub: '服务器出售 & 购买',          col2: '指令' },
  pmarket:    { label: '🏪 玩家市场',    sub: '云市场交易',                 col2: '指令' },
  combat:     { label: '⚔️ 战斗活动',    sub: 'PVE挑战 & PVP决斗',         col2: '指令' },
  mission:    { label: '📋 全服任务',    sub: '全服协作任务',               col2: '指令' },
  finance:    { label: '💰 财务管理',    sub: '银行 · 活跃点 · 兑换码',    col2: '指令' },
  info:       { label: '🔍 查询信息',    sub: '!info 系列 & 矿物扫描',     col2: '指令' },
  grid:       { label: '🛸 网格 & 状态', sub: '模式 · 升空 · 降落 · 位置', col2: '指令' },
  list:       { label: '📝 清单 & 合同', sub: '物品清单 · 玩家合同',        col2: '指令' },
  lcd:        { label: '🖥️ LCD 注入',    sub: '自定义数据关键字',           col2: '配置方式' },
  safe:       { label: '🛡️ 精英工程师',  sub: '特殊许可 & 安全区',          col2: '指令' },
};
const SECTION_ORDER = ['hangar','shipmarket','storage','build','trade','pmarket','combat','mission','finance','info','grid','list','lcd','safe'];

// ---- 渲染工具函数 ----

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// 行内 Markdown：仅处理 **bold** 和 `code`
function renderInline(md) {
  return esc(md)
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
}

// 完整 Markdown 渲染（用于 note 字段）
function renderMd(md) {
  if (!md) return '';
  let s = esc(md)
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
  return s.split(/\n\n+/).map(p => {
    p = p.trim();
    if (!p) return '';
    const lines = p.split('\n').map(l => l.trim()).filter(Boolean);
    if (lines.every(l => /^[-•]/.test(l))) {
      return '<ul>' + lines.map(l => `<li>${l.replace(/^[-•]\s*/, '')}</li>`).join('') + '</ul>';
    }
    return '<p>' + lines.join('<br>') + '</p>';
  }).join('');
}

// 从 note Markdown 提取第一个 **heading** 作为 <summary> 文本
function extractSummary(md) {
  const m = md.match(/^\*\*(.*?)\*\*/);
  return m ? m[1] : '展开说明';
}

// note body：去掉首行 **heading**\n\n 后的内容
function noteBody(md) {
  return md.replace(/^\*\*.*?\*\*\n\n?/, '');
}

// 构建单行 <tr>
function buildRow(item) {
  // c2：第一个命令是主命令，其余作别名；非 ! 开头（如 @@ 或参数键）则全部平铺
  let c2Html;
  if (!item.commands[0].startsWith('!')) {
    c2Html = item.commands.map(c => `<span class="cmd">${esc(c)}</span>`).join(' ');
  } else {
    c2Html = `<span class="cmd">${esc(item.commands[0])}</span>`;
    if (item.commands.length > 1) {
      c2Html += `<span class="al">${item.commands.slice(1).map(esc).join(' / ')}</span>`;
    }
  }

  // c3：描述 + 可选折叠 note
  let c3Html = renderInline(item.description);
  if (item.note) {
    c3Html += `<details class="note"><summary>${esc(extractSummary(item.note))}</summary><div class="note-body">${renderMd(noteBody(item.note))}</div></details>`;
  }

  return `<tr class="row" data-id="${esc(item.id)}"><td class="c1">${esc(item.title)}</td><td class="c2">${c2Html}</td><td class="c3">${c3Html}</td></tr>`;
}

// 构建整个 section div
function buildSection(secId, items) {
  const m = SECTION_META[secId];
  const rows = items.map(buildRow).join('');
  return `<div class="sec" data-sec="${secId}">
<div class="sec-h"><span class="sec-t">${m.label}</span><span class="sec-s">${m.sub}</span></div>
<table><thead><tr><th style="width:19%">想做什么</th><th style="width:39%">${m.col2}</th><th style="width:42%">说明 / 注意</th></tr></thead><tbody>
${rows}
</tbody></table></div>`;
}

// ---- 搜索 / 筛选逻辑（与数据来源无关，渲染完成后初始化）----

const syn = {
  '买船':['购买'],'购船':['购买'],'卖船':['出售'],
  '存船':['保存','船坞'],'取船':['加载'],'放船':['加载'],
  '造船':['建造','船厂'],'建船':['建造','船厂'],
  '拆船':['回收','拆解'],'修船':['修复','自动建造'],
  '蓝图':['模板'],'设计图':['模板'],'图纸':['模板'],'设计':['模板'],
  '维修':['修复','自动建造'],'焊接':['自动建造'],'修理':['修复'],
  '自动修':['自动建造'],'自修':['自动建造'],
  '存钱':['存入','银行'],'充值':['存入','银行'],
  '取钱':['取出','银行'],'提现':['取现'],
  '转钱':['转账'],'汇款':['转账'],'查余额':['余额'],
  '赚钱':['活跃','任务'],'领奖':['活跃点','领取'],
  '兑换码':['兑换'],'礼品码':['兑换'],
  '查账号':['myinfo'],'我的信息':['myinfo'],'查id':['myinfo','steamid'],
  '材料':['物资','仓库'],'物品':['仓库','物资'],
  '补给':['仓库','取出'],'搬运':['仓库'],
  '清仓':['存入全部'],'一键存':['存入全部'],
  '卖矿':['出售'],'卖材料':['出售'],'卖东西':['出售','市场'],
  '打架':['战斗','决斗'],'对战':['决斗'],'打人':['决斗'],
  '打怪':['挑战'],'刷怪':['挑战'],'刷本':['挑战'],'海盗':['挑战'],
  'pvp':['决斗'],'pve':['挑战'],'打副本':['挑战'],'竞技':['决斗'],
  '坐标':['星球坐标'],'找矿':['矿物探测'],
  '探矿':['矿物探测'],'扫矿':['矿物探测'],
  '挖矿':['矿物探测'],'采矿':['矿物探测'],
  '地图':['星球坐标'],'导航':['星球坐标'],
  '矿':['矿物','矿石'],'矿产':['矿物','矿石'],
  '估价':['估算','价值'],'价格':['价值','估算'],
  '基地':['空间站','降落'],'埋地':['降落'],'地下':['降落'],
  '入地':['降落'],'起飞':['升空'],'着陆':['降落'],
  '冻结':['空间站'],'静态':['空间站'],'动态':['飞船','toship'],
  '卡地':['升空'],'嵌地':['升空'],'陷地':['升空'],'嵌体素':['升空'],
  '体素':['升空','降落'],'钻地':['降落','升空'],
  '网格位置':['网格','坐标'],'找船':['网格位置','列表'],
  '屏幕':['lcd'],'显示器':['lcd'],'面板':['lcd'],
  '自定义数据':['lcd'],'注入':['lcd'],
  '交易':['合同','市场'],'换货':['合同'],'协议':['合同'],
  '清单':['列表','清单'],'料单':['清单','模板'],
  '保护':['安全区'],'安全':['安全区'],
  '精英':['安全区','自动建造'],'vip':['安全区','精英'],
};

function expand(t) { return syn[t] ? [t, ...syn[t]] : [t]; }

function initSearch() {
  const tabs = document.getElementById('tabs');
  const nores = document.getElementById('nores');
  const q = document.getElementById('q');
  const semPanel = document.getElementById('sem-panel');
  const searchWrap = document.querySelector('.search-wrap');
  let cur = 'all';
  let semTimer = null;

  // 构建筛选 tab
  const cats = [{id:'all',label:'全部'}, ...SECTION_ORDER.map(s => ({id:s,label:SECTION_META[s].label}))];
  cats.forEach(c => {
    const b = document.createElement('button');
    b.className = 'ftab' + (c.id === 'all' ? ' on' : '');
    b.textContent = c.label;
    b.dataset.id = c.id;
    b.onclick = () => {
      cur = c.id;
      document.querySelectorAll('.ftab').forEach(x => x.classList.toggle('on', x.dataset.id === c.id));
      filter();
    };
    tabs.appendChild(b);
  });

  function filter() {
    const v = q.value.toLowerCase().trim();
    const terms = v ? v.split(/\s+/).filter(Boolean) : [];
    let any = false;
    document.querySelectorAll('.sec').forEach(sec => {
      const id = sec.dataset.sec;
      if (cur !== 'all' && cur !== id) { sec.classList.add('hide'); return; }
      const rows = sec.querySelectorAll('tr.row');
      let vis = false;
      rows.forEach(tr => {
        const txt = tr.textContent.toLowerCase();
        const m = !terms.length || terms.every(t => expand(t).some(k => txt.includes(k)));
        tr.classList.toggle('hide', !m);
        if (m) vis = true;
      });
      sec.classList.toggle('hide', !vis);
      if (vis) any = true;
    });
    nores.style.display = any ? 'none' : 'block';
  }

  // 渲染语义搜索结果面板
  function renderSemPanel(results) {
    if (!results || results.length === 0) {
      semPanel.style.display = 'none';
      return;
    }
    const items = results.slice(0, 5).map(r => {
      const secLabel = SECTION_META[r.section] ? SECTION_META[r.section].label : r.section;
      const cmdStr = r.commands.slice(0, 2).map(c => `<code class="cmd">${esc(c)}</code>`).join(' ');
      const rawDesc = r.description ? r.description.replace(/\*\*(.*?)\*\*/g, '$1').replace(/`([^`]+)`/g, '$1') : '';
      const descStr = rawDesc.length > 65 ? esc(rawDesc.substring(0, 65)) + '…' : esc(rawDesc);
      return `<div class="sem-item" data-id="${esc(r.id)}">
        <div class="sem-item-title">${esc(r.title)}<span class="sem-item-sec">${secLabel}</span></div>
        <div class="sem-item-cmd">${cmdStr}</div>
        ${descStr ? `<div class="sem-item-desc">${descStr}</div>` : ''}
      </div>`;
    }).join('');

    semPanel.innerHTML = `<div class="sem-card">
      <div class="sem-card-h">✨ 语义相关 <span style="font-weight:normal;opacity:0.7">（可能有帮助）</span>
        <button id="sem-close" title="关闭">×</button>
      </div>${items}</div>`;
    semPanel.style.display = 'block';

    // 关闭按钮
    document.getElementById('sem-close').onclick = () => { semPanel.style.display = 'none'; };

    // 点击条目高亮滚动
    semPanel.querySelectorAll('.sem-item').forEach(el => {
      el.addEventListener('click', () => scrollToItem(el.dataset.id));
    });
  }

  // 语义搜索（600ms 防抖）
  function scheduleSemanticSearch(val) {
    clearTimeout(semTimer);
    if (!val) {
      semPanel.style.display = 'none';
      searchWrap.classList.remove('sem-loading');
      return;
    }
    semTimer = setTimeout(async () => {
      searchWrap.classList.add('sem-loading');
      try {
        const resp = await fetch(`/search?q=${encodeURIComponent(val)}&n=5`);
        if (resp.ok) renderSemPanel(await resp.json());
      } catch (_) {
        // 静默忽略，不影响关键词搜索
      } finally {
        searchWrap.classList.remove('sem-loading');
      }
    }, 600);
  }

  q.addEventListener('input', () => {
    filter();
    scheduleSemanticSearch(q.value.trim());
  });
  filter();
}

// 滚动到指定指令行并短暂高亮
function scrollToItem(id) {
  const row = document.querySelector(`tr.row[data-id="${id}"]`);
  if (!row) return;
  // 确保所在 section 可见
  const sec = row.closest('.sec');
  if (sec) sec.classList.remove('hide');
  row.classList.remove('hide');
  row.scrollIntoView({ behavior: 'smooth', block: 'center' });
  row.classList.add('sem-highlight');
  setTimeout(() => row.classList.remove('sem-highlight'), 2000);
}

// ---- 入口：fetch JSON → 渲染 → 初始化搜索 ----
fetch('commands.json')
  .then(r => r.json())
  .then(data => {
    const grouped = {};
    SECTION_ORDER.forEach(s => grouped[s] = []);
    data.forEach(item => { if (grouped[item.section]) grouped[item.section].push(item); });

    const container = document.getElementById('cmd-sections');
    container.innerHTML = SECTION_ORDER.map(s => buildSection(s, grouped[s])).join('\n');

    initSearch();
  });
</script>
